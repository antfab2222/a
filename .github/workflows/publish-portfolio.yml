name: Publish portfolio website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages-custom
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble original portfolio PDF
        run: |
          cat .github/portfolio-pdf/part-* > portfolio-antoine-fabre.pdf
          echo 'afcffb26478b6dcf0c146cd513162883346bb09e56531cdee2f92090670b2252  portfolio-antoine-fabre.pdf' | sha256sum --check
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
